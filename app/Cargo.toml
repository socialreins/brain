[package]
name = "socialreins-brain"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "socialreins-brain"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
migration = { path = "migration" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sea-orm = { version = "2.0", default-features = false, features = ["macros", "with-uuid", "with-chrono", "with-json", "runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socialreins-core = { path = "../crates/core" }
tokio = { version = "1.45", default-features = false, features = ["rt-multi-thread", "sync", "signal", "net", "macros", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6", features = ["uuid", "chrono"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v7"] }
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }

[[bin]]
name = "socialreins-brain"
path = "src/bin/main.rs"

[dev-dependencies]
axum-test = "17"
serial_test = "3.1.1"
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[lints]
workspace = true
